name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ConsoleApp1.sln

    - name: Build
      run: dotnet build ConsoleApp1.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test ConsoleApp1.sln --configuration Release --no-build --verbosity normal
